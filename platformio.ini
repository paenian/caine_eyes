; PlatformIO Project Configuration File
; Wemos D1 mini (ESP8266) — animated NeoPixel eyes
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

monitor_speed = 115200
; CH340 USB-serial clones are often unreliable at 921600; 460800 is a safe,
; fast default. Drop to 115200 if uploads still fail.
upload_speed = 460800

; FastLED drives the WS2812/NeoPixel matrix.
lib_deps =
    fastled/FastLED@^3.9.13

build_flags =
    -D FASTLED_ESP8266_RAW_PIN_ORDER
